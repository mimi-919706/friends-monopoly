<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好友大富翁</title>
<style>
:root{
  --brown:#8b5a2b;--lblue:#aae0ff;--pink:#ff7eb6;--orange:#ffb347;
  --red:#e23b3b;--yellow:#ffd23f;--green:#2e8b57;--dblue:#1b3a8b;
  --bg:#0f1320;--panel:#1a2030;--panel2:#222a3d;--line:#33405c;
  --txt:#e8ecf5;--dim:#9aa6bd;--accent:#ffd23f;--good:#3fd07e;--bad:#ff5d5d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 70% -10%,#1c2440,var(--bg));
  color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;min-height:100%;
}
/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:linear-gradient(90deg,#161b2c,#1d2438);border-bottom:1px solid var(--line);
}
.topbar h1{font-size:18px;letter-spacing:1px}
.topbar h1 span{color:var(--accent)}
.topbar .turn-info{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
.pill{padding:4px 10px;border-radius:999px;background:#0c1020;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.pill b{color:var(--txt)}
.btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;transition:.15s;
}
.btn:hover{border-color:var(--accent);background:#2a3349}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(90deg,#e0a82e,#ffd23f);color:#1a1206;border-color:#ffd23f;font-weight:600}
.btn.danger{border-color:#7a2b2b;color:#ff9f9f}
.btn.danger:hover{background:#3a1c1c}
.btn.small{padding:4px 8px;font-size:12px}

/* ===== 主区 ===== */
.main{display:flex;gap:14px;padding:14px;flex:1;min-height:0}
.board-wrap{flex:0 0 auto}
.board{
  width:min(82vh,640px);height:min(82vh,640px);
  display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);
  background:var(--panel);border:2px solid var(--line);border-radius:10px;
  position:relative;gap:1px;
}
.cell{
  background:#10172a;border:1px solid #2a3550;position:relative;
  display:flex;flex-direction:column;overflow:hidden;font-size:9px;
}
.cell .bar{height:10px;flex:0 0 10px}
.cell .nm{padding:2px 3px;text-align:center;line-height:1.05;color:var(--txt)}
.cell .pr{margin-top:auto;padding:1px 3px;text-align:center;color:var(--accent);font-size:9px}
.cell .own{position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;border:1px solid #000}
.cell .houses{position:absolute;bottom:1px;left:1px;display:flex;gap:1px}
.cell .houses i{width:5px;height:5px;background:#5fd0ff;border-radius:1px}
.cell .houses i.hotel{background:#ff7e7e;width:8px}
.cell .tok{position:absolute;bottom:1px;right:1px;display:flex;gap:1px;flex-wrap:wrap;max-width:18px}
.cell .tok i{width:8px;height:8px;border-radius:50%;border:1.5px solid #000;display:block}
.cell.corner{font-size:11px;justify-content:center;align-items:center;text-align:center}
.cell.corner .nm{font-size:10px;font-weight:600}
.cell.special{background:#14203a}
.cell .ev{font-size:8px;color:var(--dim);text-align:center;padding:0 2px}

.center{
  grid-row:2/11;grid-column:2/11;background:linear-gradient(160deg,#11192e,#0c1222);
  border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:10px;gap:8px;text-align:center;
}
.center .logo{font-size:24px;font-weight:800;letter-spacing:2px;color:var(--accent);text-shadow:0 2px 12px #000}
.center .dice-box{display:flex;gap:14px;margin:6px 0}
.die{
  width:54px;height:54px;background:#fff;color:#1a1206;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;
  box-shadow:0 4px 14px rgba(0,0,0,.5);border:1px solid #ddd;
}
.center .roll-res{font-size:13px;color:var(--dim);min-height:18px}
.center .bigbtn{margin-top:4px}

/* ===== 右侧面板 ===== */
.side{flex:1;min-width:280px;display:flex;flex-direction:column;gap:12px;min-height:0}
.players{display:flex;flex-direction:column;gap:8px}
.player{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  border-left:5px solid #555;transition:.15s;
}
.player.active{box-shadow:0 0 0 2px var(--accent);border-left-color:var(--accent)}
.player .top{display:flex;align-items:center;gap:8px}
.player .av{width:26px;height:26px;border-radius:50%;border:2px solid #000;flex:0 0 auto}
.player .name{font-weight:600;font-size:14px}
.player .cash{margin-left:auto;font-size:14px;color:var(--good);font-weight:700}
.player .meta{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.player .meta .props{color:var(--lblue)}
.player .items{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.item-chip{font-size:10px;padding:2px 5px;border-radius:5px;background:#2a3350;border:1px solid #3a4664;cursor:default}
.item-chip.use{cursor:pointer}
.item-chip.use:hover{border-color:var(--accent)}
.log{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  flex:1;min-height:120px;overflow-y:auto;font-size:12px;line-height:1.5;
}
.log .li{padding:2px 0;color:var(--dim)}
.log .li b{color:var(--txt)}
.log .li.good{color:var(--good)} .log .li.bad{color:var(--bad)} .log .li.evt{color:#ffd23f}

/* ===== 模态框 ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;align-items:center;justify-content:center;padding:14px}
.mask.show{display:flex}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(460px,94vw);max-height:86vh;overflow:auto;padding:18px;
}
.modal h2{font-size:17px;margin-bottom:10px}
.modal .row{margin:8px 0;font-size:13px;line-height:1.6}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.field label{width:84px;color:var(--dim)}
.field input,.field select{
  flex:1;background:#0c1222;border:1px solid var(--line);color:var(--txt);
  padding:7px 9px;border-radius:7px;font-size:13px;
}
.list{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.opt:hover{background:#222a3d}
.opt.sel{background:#2a3349;border:1px solid var(--accent)}
.opt .swatch{width:14px;height:14px;border-radius:3px;border:1px solid #000;flex:0 0 auto}
.auction-bid{font-size:13px;color:var(--accent);margin-top:4px}

/* 开始界面 */
.start-screen{position:fixed;inset:0;background:radial-gradient(900px 600px at 50% -10%,#26305a,#0f1320);display:flex;align-items:center;justify-content:center;z-index:100}
.start-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(420px,92vw)}
.start-card h1{font-size:26px;text-align:center;color:var(--accent);margin-bottom:6px}
.start-card p{font-size:12px;color:var(--dim);text-align:center;margin-bottom:16px;line-height:1.6}
.color-pick{display:flex;gap:8px;justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
.cpick{width:30px;height:30px;border-radius:50%;border:2px solid #000;cursor:pointer}
.cpick.sel{outline:2px solid var(--accent);outline-offset:2px}
.player-list{font-size:13px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.player-list .pl{display:flex;align-items:center;gap:8px;background:#0c1222;padding:6px 8px;border-radius:7px}
.player-list .pl .sw{width:14px;height:14px;border-radius:3px;border:1px solid #000}

.win-screen{text-align:center}
.win-screen .crown{font-size:48px;margin:6px 0}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎲 好友<span>大富翁</span></h1>
  <div class="turn-info">
    <div class="pill" id="phasePill">准备中</div>
    <div class="pill">回合 <b id="turnNum">1</b></div>
    <div class="pill">当前 <b id="curPlayer">—</b></div>
  </div>
  <button class="btn small" id="btnTrade">🤝 交易</button>
  <button class="btn small" id="btnBuild">🔨 建房</button>
  <button class="btn small danger" id="btnResign">🏳️ 认输</button>
</div>

<div class="main">
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
  <div class="side">
    <div class="players" id="players"></div>
    <div class="log" id="log"></div>
  </div>
</div>

<!-- 模态：行动 -->
<div class="mask" id="mModal"><div class="modal" id="mContent"></div></div>

<!-- 开始界面 -->
<div class="start-screen" id="startScreen">
  <div class="start-card">
    <h1>好友大富翁</h1>
    <p>同设备热座版 · 2-4 人轮流操作<br>买地·收租·随机事件·道具·交易·拍卖</p>
    <div class="field"><label>加入昵称</label><input id="inName" maxlength="6" value="玩家1"></div>
    <div class="field"><label>选颜色</label><div class="color-pick" id="colorPick"></div></div>
    <button class="btn primary" id="btnJoin" style="width:100%;margin-top:6px">加入游戏</button>
    <div class="player-list" id="startList"></div>
    <button class="btn" id="btnStart" style="width:100%;margin-top:6px" disabled>开始游戏</button>
  </div>
</div>

<script>
/* =========================================================
   数据
========================================================= */
const COLORS={brown:'#8b5a2b',lblue:'#aae0ff',pink:'#ff7eb6',orange:'#ffb347',
  red:'#e23b3b',yellow:'#ffd23f',green:'#2e8b57',dblue:'#1b3a8b',rr:'#3a3a3a',util:'#6b6b6b'};
const GROUPS={brown:{n:2,house:50},lblue:{n:3,house:50},pink:{n:3,house:100},orange:{n:3,house:100},
  red:{n:3,house:150},yellow:{n:3,house:150},green:{n:3,house:200},dblue:{n:2,house:200}};

// type: go jail parking gotojail tax chance fate prop rr util
// prop: name,group,price,rent[0..5](0=no house base doubled if full set;1..4 houses;5 hotel)
const SPACES=[
  {t:'go',name:'起点'},
  {t:'prop',name:'胡同甲',g:'brown',price:60,rent:[2,10,30,90,160,250]},
  {t:'fate',name:'命运'},
  {t:'prop',name:'胡同乙',g:'brown',price:60,rent:[4,20,60,180,320,450]},
  {t:'tax',name:'所得税',amount:200},
  {t:'rr',name:'北方车站',price:200},
  {t:'prop',name:'小镇甲',g:'lblue',price:100,rent:[6,30,90,270,400,550]},
  {t:'chance',name:'机会'},
  {t:'prop',name:'小镇乙',g:'lblue',price:100,rent:[6,30,90,270,400,550]},
  {t:'prop',name:'小镇丙',g:'lblue',price:120,rent:[8,40,100,300,450,600]},
  {t:'jail',name:'监狱'},
  {t:'prop',name:'老街甲',g:'pink',price:140,rent:[10,50,150,450,625,750]},
  {t:'util',name:'电力公司',price:150},
  {t:'prop',name:'老街乙',g:'pink',price:140,rent:[10,50,150,450,625,750]},
  {t:'prop',name:'老街丙',g:'pink',price:160,rent:[12,60,180,500,700,900]},
  {t:'rr',name:'东方车站',price:200},
  {t:'prop',name:'新区甲',g:'orange',price:180,rent:[14,70,200,550,700,900]},
  {t:'fate',name:'命运'},
  {t:'prop',name:'新区乙',g:'orange',price:180,rent:[14,70,200,550,700,900]},
  {t:'prop',name:'新区丙',g:'orange',price:200,rent:[16,80,220,600,800,1000]},
  {t:'parking',name:'免费停车'},
  {t:'prop',name:'商街甲',g:'red',price:220,rent:[18,90,250,700,875,1050]},
  {t:'fate',name:'命运'},
  {t:'prop',name:'商街乙',g:'red',price:220,rent:[18,90,250,700,875,1050]},
  {t:'prop',name:'商街丙',g:'red',price:240,rent:[20,100,300,750,925,1100]},
  {t:'rr',name:'南方车站',price:200},
  {t:'prop',name:'金融甲',g:'yellow',price:260,rent:[22,110,330,800,975,1150]},
  {t:'chance',name:'机会'},
  {t:'prop',name:'金融乙',g:'yellow',price:260,rent:[22,110,330,800,975,1150]},
  {t:'prop',name:'金融丙',g:'yellow',price:280,rent:[24,120,360,850,1025,1200]},
  {t:'gotojail',name:'入狱'},
  {t:'prop',name:'豪宅甲',g:'green',price:300,rent:[26,130,390,900,1100,1275]},
  {t:'prop',name:'豪宅乙',g:'green',price:300,rent:[26,130,390,900,1100,1275]},
  {t:'fate',name:'命运'},
  {t:'prop',name:'豪宅丙',g:'green',price:320,rent:[28,150,450,1000,1200,1400]},
  {t:'rr',name:'西方车站',price:200},
  {t:'chance',name:'机会'},
  {t:'prop',name:'富豪甲',g:'dblue',price:350,rent:[35,175,500,1100,1300,1500]},
  {t:'tax',name:'奢侈税',amount:100},
  {t:'prop',name:'富豪乙',g:'dblue',price:400,rent:[50,200,600,1400,1700,2000]},
];

const PLAYER_COLORS=['#ff5d5d','#5fb8ff','#5fd07e','#ffd23f'];
const PLAYER_AV=['🔴','🔵','🟢','🟡'];
const START_CASH=1500;
const GO_BONUS=200;
const JAIL_FINE=50;

// 道具卡
const ITEMS={
  rentfree:{name:'🛡️免租卡',desc:'本次需付租金时自动免单'},
  x2rent:{name:'💰双倍收租',desc:'本回合收到的租金翻倍'},
  teleport:{name:'🚕传送卡',desc:'移动到指定格子'},
  steal:{name:'🕵️偷钱卡',desc:'从某玩家偷取100'},
  protect:{name:'💸收保护费',desc:'向所有其他玩家各收50'},
  swap:{name:'🔄换房卡',desc:'与某玩家交换一块地产'},
  freeze:{name:'🧊冻结卡',desc:'指定玩家下回合跳过'},
  reroll:{name:'🎲重骰卡',desc:'本回合重新掷骰'},
  lucky:{name:'🎁幸运卡',desc:'获得一个随机道具'},
  troll:{name:'😈损友卡',desc:'指定玩家付100给银行'},
};
const ITEM_KEYS=Object.keys(ITEMS);

// 卡牌(机会/命运) -> 对应"随机事件"
const CARDS=[
  {d:'意外之财',f:()=>-1,kind:'money',a:[100,200,300]},
  {d:'钱包被偷',f:()=>1,kind:'money',a:[-100,-150,-200]},
  {d:'罚款通知',f:()=>1,kind:'money',a:[-50,-75,-100]},
  {d:'市场上涨',f:()=>-1,kind:'item',a:['x2rent']},
  {d:'幸运骰子',f:()=>-1,kind:'item',a:['reroll']},
  {d:'损友事件',f:()=>1,kind:'troll',a:[50,100]},
  {d:'银行分红',f:()=>-1,kind:'money',a:[50,80]},
  {d:'维修费',f:()=>1,kind:'repair',a:[25,40]},
  {d:'生日红包',f:()=>-1,kind:'birthday',a:[20]},
  {d:'前进至起点',f:()=>-1,kind:'moveto',a:[0]},
  {d:'前进至车站',f:()=>-1,kind:'moveto',a:[5]},
  {d:'直达监狱',f:()=>-1,kind:'gotojail',a:[]},
];

/* =========================================================
   状态
========================================================= */
let G=null; // game state
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

function newGame(players){
  G={
    players:players.map((p,i)=>({
      id:i,name:p.name,color:p.color,av:p.av,
      cash:START_CASH,pos:0,props:[],items:[],
      jailTurns:0,skipNext:false,x2rentThisTurn:false,
      alive:true,rolledThisTurn:false,movedThisTurn:false,
    })),
    owners:Array(40).fill(null),
    houses:Array(40).fill(0),
    turn:0,turnIdx:0,phase:'roll',log:[],
    dice:[1,1],lastCardIdx:-1,lastCardKind:null,
    pending:null, // pending action state
  };
  // 每人发1个随机道具
  G.players.forEach(p=>{ if(p.alive) p.items.push(randItem()); });
  log('游戏开始！每人初始现金 '+START_CASH+'，并随机获得1张道具卡。','evt');
  startTurn();
}

function randItem(){return ITEM_KEYS[Math.floor(Math.random()*ITEM_KEYS.length)];}

/* =========================================================
   工具
========================================================= */
function log(msg,cls=''){const li=el('div','li '+cls);li.innerHTML=msg;G.log.push(li);$('log').appendChild(li);$('log').scrollTop=$('log').scrollHeight;}
function cur(){return G.players[G.turnIdx];}
function alivePlayers(){return G.players.filter(p=>p.alive);}
function rrCount(p){return p.props.filter(i=>SPACES[i].t==='rr').length;}
function utilCount(p){return p.props.filter(i=>SPACES[i].t==='util').length;}
function ownsFullGroup(p,g){const idxs=SPACES.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);return idxs.every(i=>G.owners[i]===p.id);}
function groupOf(i){return SPACES[i].g;}
function isProp(i){const t=SPACES[i].t;return t==='prop'||t==='rr'||t==='util';}
function networth(p){
  let v=p.cash;
  p.props.forEach(i=>{const s=SPACES[i];v+=s.price||0;v+=(G.houses[i]||0)*((GROUPS[s.g]?.house)||0);});
  return v;
}
function posToCell(p){
  if(p<=10)return{r:10,c:10-p};
  if(p<=20)return{r:20-p,c:0};
  if(p<=30)return{r:0,c:p-20};
  return{r:p-30,c:10};
}

/* =========================================================
   渲染
========================================================= */
function renderBoard(){
  const b=$('board');b.innerHTML='';
  // 创建 11x11 单元格占位
  const grid=Array.from({length:11},()=>Array(11).fill(null));
  for(let p=0;p<40;p++){const{r,c}=posToCell(p);grid[r][c]=p;}
  for(let r=0;r<11;r++)for(let c=0;c<11;c++){
    const cell=el('div','cell');
    const p=grid[r][c];
    if(p==null){
      if(r>=1&&r<=9&&c>=1&&c<=9){continue;} // 中心稍后单独放
      cell.style.visibility='hidden';b.appendChild(cell);continue;
    }
    const s=SPACES[p];
    if(p%10===0)cell.classList.add('corner');
    // 色条
    if(s.g){const bar=el('div','bar');bar.style.background=COLORS[s.g];cell.appendChild(bar);}
    else if(s.t==='rr'||s.t==='util'){const bar=el('div','bar');bar.style.background=COLORS[s.t==='rr'?'rr':'util'];cell.appendChild(bar);}
    else if(s.t==='chance'){const bar=el('div','bar');bar.style.background='#7b5cff';cell.appendChild(bar);}
    else if(s.t==='fate'){const bar=el('div','bar');bar.style.background='#ff5da2';cell.appendChild(bar);}
    const nm=el('div','nm');nm.textContent=s.name;cell.appendChild(nm);
    if(s.price){const pr=el('div','pr');pr.textContent='¥'+s.price;cell.appendChild(pr);}
    if(s.t==='tax'){const pr=el('div','pr');pr.textContent='-¥'+s.amount;cell.appendChild(pr);}
    if(s.t==='chance'||s.t==='fate'){const ev=el('div','ev');ev.textContent='抽卡';cell.appendChild(ev);}
    // 持有者
    cell.dataset.pos=p;
    b.appendChild(cell);
  }
  // 中心区
  const center=el('div','center');
  center.style.gridRow='2/11';center.style.gridColumn='2/11';
  center.innerHTML=`
    <div class="logo">大富翁</div>
    <div class="dice-box"><div class="die" id="die1">1</div><div class="die" id="die2">1</div></div>
    <div class="roll-res" id="rollRes">点击下方掷骰</div>
    <button class="btn primary bigbtn" id="btnRoll">🎲 掷骰子</button>`;
  b.appendChild(center);
  refreshBoardDecor();
  $('btnRoll').onclick=onRoll;
}

function refreshBoardDecor(){
  if(!G)return;
  // 在每个格子上刷新 owner / houses / 玩家棋子
  const cells=$('board').querySelectorAll('.cell[data-pos]');
  cells.forEach(cell=>{
    // 清掉旧的
    cell.querySelectorAll('.own,.houses,.tok').forEach(e=>e.remove());
    const p=+cell.dataset.pos;
    const s=SPACES[p];
    const owner=G.owners[p];
    if(owner!=null){
      const o=el('div','own');o.style.background=G.players[owner].color;cell.appendChild(o);
    }
    if(s.g&&G.houses[p]>0){
      const h=el('div','houses');
      const n=G.houses[p];
      if(n===5){const i=el('i','hotel');h.appendChild(i);}
      else{for(let k=0;k<n;k++)h.appendChild(el('i'));}
      cell.appendChild(h);
    }
    // 玩家棋子
    const tok=el('div','tok');
    G.players.forEach(pl=>{
      if(pl.alive&&pl.pos===p){
        const i=el('i');i.style.background=pl.color;i.title=pl.name;tok.appendChild(i);
      }
    });
    if(tok.children.length)cell.appendChild(tok);
  });
}

function renderPlayers(){
  if(!G)return;
  const box=$('players');box.innerHTML='';
  G.players.forEach(p=>{
    const card=el('div','player'+(G.turnIdx===p.id?' active':''));
    card.style.borderLeftColor=p.color;
    const propCount=p.props.length;
    const rr=rrCount(p),ut=utilCount(p);
    let meta=`<span>💰 <b>${p.cash}</b></span><span class="props">🏠 ${propCount}</span>`;
    if(rr)meta+=`<span>🚂${rr}</span>`;
    if(ut)meta+=`<span>⚡${ut}</span>`;
    if(p.jailTurns>0)meta+=`<span>🔒监狱${p.jailTurns}</span>`;
    if(p.skipNext)meta+=`<span>🧊冻结</span>`;
    if(p.x2rentThisTurn)meta+=`<span>💰x2</span>`;
    if(!p.alive)meta=`<span style="color:var(--bad)">已破产</span>`;
    let itemsHtml='';
    p.items.forEach((it,idx)=>{
      const ownTurn=(G.turnIdx===p.id&&p.alive);
      itemsHtml+=`<span class="item-chip${ownTurn?' use':''}" data-item="${it}" data-pi="${p.id}" data-idx="${idx}" title="${ITEMS[it].desc}">${ITEMS[it].name}</span>`;
    });
    card.innerHTML=`
      <div class="top"><div class="av" style="background:${p.color}"></div>
      <div class="name">${p.av} ${p.name}</div>
      <div class="cash">${p.alive?'¥'+p.cash:'—'}</div></div>
      <div class="meta">${meta}</div>
      ${itemsHtml?`<div class="items">${itemsHtml}</div>`:''}`;
    box.appendChild(card);
  });
  // 绑定道具使用
  box.querySelectorAll('.item-chip.use').forEach(ch=>{
    ch.onclick=()=>useItem(+ch.dataset.pi,ch.dataset.item,+ch.dataset.idx);
  });
  // 顶栏
  $('curPlayer').textContent=cur().name;
  $('turnNum').textContent=G.turn+1;
  const phaseMap={roll:'掷骰阶段',move:'移动结算',end:'回合结束'};
  $('phasePill').textContent=phaseMap[G.phase]||G.phase;
  const canTrade=alivePlayers().length>=2&&G.phase!=='over';
  $('btnTrade').disabled=!canTrade;
  $('btnBuild').disabled=!cur().alive||G.phase==='over';
  $('btnResign').disabled=!cur().alive||G.phase==='over';
}

function refresh(){
  if(!G)return;
  refreshBoardDecor();
  renderPlayers();
}

/* =========================================================
   回合流程
========================================================= */
function startTurn(){
  const p=cur();
  if(!p.alive){nextPlayer();return;}
  p.rolledThisTurn=false;p.movedThisTurn=false;p.x2rentThisTurn=false;
  G.phase='roll';
  // 处理冻结
  if(p.skipNext){
    log(`${p.av} ${p.name} 被冻结，跳过本回合。`,'bad');
    p.skipNext=false;nextPlayer();return;
  }
  // 监狱处理
  if(p.jailTurns>0){
    G.phase='jail';
    log(`${p.av} ${p.name} 在监狱中（剩余${p.jailTurns}），可交¥${JAIL_FINE}保释或尝试掷双数。`,'evt');
    showJailModal();
    refresh();return;
  }
  refresh();
  log(`—— 轮到 ${p.av} ${p.name} ——`);
  updateRollBtn();
}

function updateRollBtn(){
  const b=$('btnRoll');if(!b)return;
  if(G.phase==='roll'){b.disabled=false;b.textContent='🎲 掷骰子';}
  else if(G.phase==='move'){b.disabled=true;b.textContent='移动中…';}
  else{b.disabled=true;b.textContent='回合结束';}
}

function onRoll(){
  if(G.phase!=='roll'&&G.phase!=='reroll')return;
  const p=cur();
  // 掷骰
  const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6);
  G.dice=[d1,d2];$('die1').textContent=d1;$('die2').textContent=d2;
  const isDouble=d1===d2;
  if(G.phase==='reroll'){G.phase='roll';}
  // 监狱内的掷骰
  if(p.jailTurns>0){
    if(isDouble){
      log(`${p.av} ${p.name} 掷出双 ${d1}，出狱！`,'good');
      p.jailTurns=0;
      movePlayer(d1+d2);
    }else{
      p.jailTurns--;
      if(p.jailTurns<=0){
        log(`${p.av} ${p.name} 未掷出双数，且已满3回合，须交¥${JAIL_FINE}保释出狱。`,'bad');
        pay(p,JAIL_FINE,null,'保释金');
        p.jailTurns=0;
        movePlayer(d1+d2);
      }else{
        log(`${p.av} ${p.name} 未掷出双数，仍在狱中（剩余${p.jailTurns}）。`,'bad');
        endTurn();
      }
    }
    refresh();return;
  }
  log(`${p.av} ${p.name} 掷出 ${d1} + ${d2} = ${d1+d2}${isDouble?'（双数！）':''}`);
  p.rolledThisTurn=true;
  // 连续双数入狱
  p.doubles=(p.doubles||0)+(isDouble?1:0);
  if(p.doubles>=3){
    log(`${p.av} ${p.name} 连续3次双数，直接入狱！`,'bad');
    sendToJail(p);p.doubles=0;endTurn();return;
  }
  if(!isDouble)p.doubles=0;
  movePlayer(d1+d2);
}

function movePlayer(steps){
  const p=cur();
  const old=p.pos;
  let np=old+steps;
  if(np>=40){np-=40;p.cash+=GO_BONUS;log(`${p.av} ${p.name} 经过起点，领¥${GO_BONUS}。`,'good');}
  p.pos=np;
  p.movedThisTurn=true;
  refresh();
  setTimeout(()=>landOnSpace(p,np),250);
}

function landOnSpace(p,pos){
  const s=SPACES[pos];
  switch(s.t){
    case 'go': endTurn();break;
    case 'parking': log(`${p.av} 踩到免费停车，无事发生。`);endTurn();break;
    case 'jail': log(`${p.av} 路过监狱（探监）。`);endTurn();break;
    case 'gotojail': log(`${p.av} ${p.name} 踩到入狱格，进监狱！`,'bad');sendToJail(p);endTurn();break;
    case 'tax': pay(p,s.amount,null,s.name);log(`${p.av} ${p.name} 缴${s.name} ¥${s.amount}。`,'bad');afterSpend(p);break;
    case 'chance':drawCard('chance');break;
    case 'fate':drawCard('fate');break;
    case 'prop':case 'rr':case 'util':handleProperty(p,pos);break;
  }
}

function afterSpend(p){
  // 付款后检查破产
  if(checkBankruptcy(p))return;
  endTurn();
}

/* ---- 地产处理 ---- */
function handleProperty(p,pos){
  const s=SPACES[pos];const owner=G.owners[pos];
  if(owner==null){
    // 可买或拍卖
    G.phase='move';
    showBuyModal(p,pos);
  }else if(owner===p.id){
    log(`${p.av} ${p.name} 到达自己的 ${s.name}，安全通过。`,'good');
    endTurn();
  }else{
    // 付租金 —— 优先检查免租卡
    const rfIdx=p.items.indexOf('rentfree');
    if(rfIdx>=0){
      p.items.splice(rfIdx,1);
      log(`${p.av} ${p.name} 使用免租卡，免付 ${s.name} 租金！`,'evt');
      endTurn();return;
    }
    const rent=calcRent(p,owner,pos);
    const owe=p.x2rentThisTurn?rent*2:rent;
    if(p.x2rentThisTurn)log(`(双倍收租生效)`);
    pay(p,owe,G.players[owner],`租金`);
    log(`${p.av} ${p.name} 向 ${G.players[owner].av} 支付 ${s.name} 租金 ¥${owe}。`,'bad');
    G.players[owner].x2rentThisTurn=false;
    afterSpend(p);
  }
}

function calcRent(payer,owner,pos){
  const s=SPACES[pos];const ow=G.players[owner];
  if(s.t==='prop'){
    const h=G.houses[pos];
    let r=s.rent[h];
    if(h===0&&ownsFullGroup(ow,s.g))r*=2; // 全组双倍
    return r;
  }
  if(s.t==='rr'){
    const n=rrCount(ow);
    const tbl=[0,25,50,100,200];
    return tbl[n];
  }
  if(s.t==='util'){
    const n=utilCount(ow);
    const mult=n===2?10:4;
    return mult*(G.dice[0]+G.dice[1]);
  }
  return 0;
}

/* ---- 买地模态 ---- */
function showBuyModal(p,pos){
  const s=SPACES[pos];
  const canBuy=p.cash>=s.price;
  openModal(`
    <h2>🏠 ${s.name}</h2>
    <div class="row">${s.t==='prop'?`<span style="display:inline-block;width:14px;height:14px;background:${COLORS[s.g]};border:1px solid #000;border-radius:3px;vertical-align:middle"></span> `:''}价格 <b style="color:var(--accent)">¥${s.price}</b> · 你现有 ¥${p.cash}</div>
    <div class="row">${canBuy?'是否购买？':'现金不足，可选择拍卖。'}</div>
    <div class="actions">
      <button class="btn" onclick="closeModal();auctionProperty(${pos})">🔨 拍卖</button>
      ${canBuy?`<button class="btn primary" onclick="buyProperty(${pos})">购买 ¥${s.price}</button>`:''}
      <button class="btn" onclick="closeModal();skipBuy()">跳过</button>
    </div>`);
}
function buyProperty(pos){
  const p=cur();const s=SPACES[pos];
  if(p.cash<s.price){return;}
  p.cash-=s.price;G.owners[pos]=p.id;p.props.push(pos);
  log(`${p.av} ${p.name} 购入 ${s.name}（¥${s.price}）。`,'good');
  closeModal();afterSpend(p);
}
function skipBuy(){closeModal();log(`${cur().av} ${cur().name} 放弃购买。`);endTurn();}

/* ---- 拍卖 ---- */
function auctionProperty(pos){
  const s=SPACES[pos];
  const bidders=alivePlayers().map(p=>p.id);
  if(bidders.length===0){endTurn();return;}
  G.pending={type:'auction',pos,bidders,cur:0,bid:0,topBidder:null,passed:[]};
  log(`🔨 ${s.name} 进入拍卖（起拍价 ¥0，每次加价 ≥¥10）。`,'evt');
  auctionNext();
}
function auctionNext(){
  const a=G.pending;if(!a)return;
  const left=a.bidders.filter(id=>!a.passed.includes(id));
  if(left.length===0){auctionEnd();return;}
  if(left.length===1&&a.topBidder!==null&&left[0]===a.topBidder){auctionEnd();return;}
  const pid=a.bidders[a.cur];
  if(a.passed.includes(pid)){a.cur=(a.cur+1)%a.bidders.length;auctionNext();return;}
  const bid=G.players[pid];
  openModal(`
    <h2>🔨 拍卖：${SPACES[a.pos].name}</h2>
    <div class="row">当前最高出价：<b style="color:var(--accent)">¥${a.bid}</b>${a.topBidder!==null?`（${G.players[a.topBidder].av} ${G.players[a.topBidder].name}）`:''}</div>
    <div class="row">轮到 <b style="color:${bid.color}">${bid.av} ${bid.name}</b>（现金 ¥${bid.cash}）</div>
    <div class="field"><label>出价</label><input id="bidInput" type="number" min="${a.bid+10}" value="${a.bid+10}"></div>
    <div class="actions">
      <button class="btn" onclick="auctionPass()">弃权</button>
      <button class="btn primary" onclick="auctionBid()">出价</button>
    </div>`);
  setTimeout(()=>$('bidInput')?.focus(),50);
}
function auctionBid(){
  const a=G.pending;const v=+$('bidInput').value;
  if(!v||v<a.bid+10){alert(`出价须 ≥ ¥${a.bid+10}`);return;}
  const pid=a.bidders[a.cur];
  if(v>G.players[pid].cash){alert('现金不足');return;}
  a.bid=v;a.topBidder=pid;
  log(`${G.players[pid].av} ${G.players[pid].name} 出价 ¥${v}。`);
  do{a.cur=(a.cur+1)%a.bidders.length;}while(a.passed.includes(a.bidders[a.cur]));
  closeModal();auctionNext();
}
function auctionPass(){
  const a=G.pending;const pid=a.bidders[a.cur];
  a.passed.push(pid);
  log(`${G.players[pid].av} ${G.players[pid].name} 弃权。`);
  do{a.cur=(a.cur+1)%a.bidders.length;}while(a.passed.includes(a.bidders[a.cur])&&a.passed.length<a.bidders.length);
  closeModal();auctionNext();
}
function auctionEnd(){
  const a=G.pending;const s=SPACES[a.pos];
  if(a.topBidder===null){log(`拍卖流拍，${s.name} 无人购买。`,'evt');G.pending=null;endTurn();return;}
  const p=G.players[a.topBidder];
  p.cash-=a.bid;G.owners[a.pos]=p.id;p.props.push(a.pos);
  log(`🔨 成交！${p.av} ${p.name} 以 ¥${a.bid} 拍得 ${s.name}。`,'good');
  G.pending=null;closeModal();afterSpend(p);
}

/* ---- 卡牌(随机事件) ---- */
function drawCard(kind){
  // 避免连续重复
  let idx;
  do{idx=Math.floor(Math.random()*CARDS.length);}while(idx===G.lastCardIdx&&CARDS.length>1);
  G.lastCardIdx=idx;
  const c=CARDS[idx];G.lastCardKind=kind;
  const p=cur();
  log(`🎁 ${kind==='chance'?'机会':'命运'}卡：${c.d}（${kind}）`,'evt');
  applyCard(c,p);
}
function applyCard(c,p){
  switch(c.kind){
    case 'money':{
      const amt=c.a[Math.floor(Math.random()*c.a.length)];
      if(amt>0){p.cash+=amt;log(`${p.av} ${p.name} 获得 ¥${amt}。`,'good');}
      else{const cost=-amt;pay(p,cost,null,c.d);log(`${p.av} ${p.name} ${c.d} ¥${cost}。`,'bad');}
      afterSpend(p);break;
    }
    case 'item':{
      const it=c.a[Math.floor(Math.random()*c.a.length)];
      p.items.push(it);log(`${p.av} ${p.name} 获得道具 ${ITEMS[it].name}。`,'good');
      endTurn();break;
    }
    case 'troll':{
      // 损友事件：所有其他玩家各付
      const amt=c.a[Math.floor(Math.random()*c.a.length)];
      let any=false;
      G.players.forEach(o=>{if(o.id!==p.id&&o.alive){pay(o,amt,null,'损友事件');any=true;}});
      log(`${p.av} ${p.name} 触发损友事件，其他玩家各付 ¥${amt}。`,'bad');
      // 检查破产
      let broke=false;
      G.players.forEach(o=>{if(!o.alive)broke=true;});
      endTurn();break;
    }
    case 'repair':{
      // 维修费：每栋房子付费
      const per=c.a[Math.floor(Math.random()*c.a.length)];
      let total=0;
      p.props.forEach(i=>total+=(G.houses[i]||0)*per);
      if(total>0){pay(p,total,null,'维修费');log(`${p.av} ${p.name} 维修费 ¥${total}。`,'bad');afterSpend(p);}
      else{log(`${p.av} ${p.name} 无房产需维修。`);endTurn();}
      break;
    }
    case 'birthday':{
      const amt=c.a[0];let got=0;
      G.players.forEach(o=>{if(o.id!==p.id&&o.alive){if(o.cash>=amt){o.cash-=amt;got+=amt;}else{got+=o.cash;o.cash=0;}}});
      p.cash+=got;log(`${p.av} ${p.name} 生日，每人送 ¥${amt}，共收 ¥${got}。`,'good');endTurn();break;
    }
    case 'moveto':{
      const target=c.a[0];
      if(p.pos>target){p.cash+=GO_BONUS;log(`${p.av} ${p.name} 经过起点领¥${GO_BONUS}。`,'good');}
      p.pos=target;refresh();
      setTimeout(()=>landOnSpace(p,target),250);
      break;
    }
    case 'gotojail':{sendToJail(p);endTurn();break;}
  }
}

/* ---- 监狱 ---- */
function sendToJail(p){p.pos=10;p.jailTurns=3;p.doubles=0;log(`${p.av} ${p.name} 入狱（3回合）。`,'bad');}
function showJailModal(){
  const p=cur();
  openModal(`
    <h2>🔒 在监狱中</h2>
    <div class="row">${p.av} ${p.name}，剩余 ${p.jailTurns} 回合。</div>
    <div class="row">交 ¥${JAIL_FINE} 保释后立即掷骰移动，或尝试掷双数出狱（失败则留在狱中）。</div>
    <div class="actions">
      <button class="btn" onclick="jailPay()">交¥${JAIL_FINE}保释</button>
      <button class="btn primary" onclick="jailRoll()">掷骰尝试</button>
    </div>`);
}
function jailPay(){
  const p=cur();pay(p,JAIL_FINE,null,'保释金');p.jailTurns=0;
  log(`${p.av} ${p.name} 交保释金出狱。`,'bad');closeModal();G.phase='roll';updateRollBtn();refresh();
}
function jailRoll(){closeModal();G.phase='roll';onRoll();}

/* ---- 付款与破产 ---- */
function pay(p,amount,to,reason){
  if(amount<=0)return;
  if(p.cash>=amount){p.cash-=amount;if(to)to.cash+=amount;return;}
  // 现金不足，尝试卖房/抵押（简化：自动按需处置）
  raiseCash(p,amount);
  if(p.cash>=amount){p.cash-=amount;if(to)to.cash+=amount;}
  // 仍不足则破产在 checkBankruptcy 处理
}
function raiseCash(p,need){
  // 1) 先卖房子
  let guard=0;
  while(p.cash<need&&guard++<200){
    // 找一个有房子的地产
    const i=p.props.find(idx=>G.houses[idx]>0);
    if(i==null)break;
    const s=SPACES[i];const hc=GROUPS[s.g]?.house||0;
    G.houses[i]--;p.cash+=Math.floor(hc/2);
    log(`${p.av} ${p.name} 变卖 ${s.name} 1座房，得 ¥${Math.floor(hc/2)}。`,'evt');
  }
  // 2) 抵押地产（半价卖给银行，失去产权）
  while(p.cash<need&&p.props.length>0){
    const i=p.props[0];
    const s=SPACES[i];const val=Math.floor((s.price||0)/2);
    if(val<=0){p.props.shift();continue;}
    p.cash+=val;G.owners[i]=null;
    p.props=p.props.filter(x=>x!==i);G.houses[i]=0;
    log(`${p.av} ${p.name} 抵押 ${s.name}，得 ¥${val}。`,'bad');
  }
}
function checkBankruptcy(p){
  if(p.cash>=0)return false;
  // 已无法筹资 -> 破产
  p.alive=false;
  // 把地产转给银行（若有欠某玩家租金，则地产归该玩家——简化：归银行）
  p.props.forEach(i=>{G.owners[i]=null;G.houses[i]=0;});
  p.props=[];
  log(`${p.av} ${p.name} 破产出局！💸`,'bad');
  refresh();
  if(checkWin())return true;
  return true;
}
function checkWin(){
  const alive=alivePlayers();
  if(alive.length<=1){
    const winner=alive[0]||G.players.reduce((a,b)=>networth(a)>=networth(b)?a:b);
    G.phase='over';
    showWin(winner);
    return true;
  }
  return false;
}

/* ---- 回合结束 ---- */
function endTurn(){
  if(G.phase==='over')return;
  const p=cur();
  // 双数额外回合（监狱内不算）
  if(p.doubles>0&&p.jailTurns===0&&p.movedThisTurn&&p.alive){
    log(`${p.av} ${p.name} 双数，获得额外回合！`,'good');
    G.phase='roll';p.movedThisTurn=false;refresh();updateRollBtn();return;
  }
  nextPlayer();
}
function nextPlayer(){
  if(G.phase==='over')return;
  for(let k=0;k<G.players.length;k++){
    G.turnIdx=(G.turnIdx+1)%G.players.length;
    G.turn++;
    if(cur().alive)break;
  }
  startTurn();
}

/* =========================================================
   道具卡
========================================================= */
function useItem(pid,itemKey,idx){
  if(pid!==cur().id||G.phase==='over'){return;}
  const p=cur();
  // 部分道具仅特定阶段可用
  const always=['rentfree']; // rentfree 被动，不应手动用
  if(itemKey==='rentfree'){alert('免租卡将在你被收租时自动使用，无需手动。');return;}
  // 消耗道具
  p.items.splice(idx,1);
  refresh();
  switch(itemKey){
    case 'x2rent':p.x2rentThisTurn=true;log(`${p.av} ${p.name} 启用双倍收租（本回合收租翻倍）。`,'evt');refresh();break;
    case 'reroll':G.phase='reroll';log(`${p.av} ${p.name} 使用重骰卡，可重新掷骰。`,'evt');updateRollBtn();break;
    case 'lucky':{const it=randItem();p.items.push(it);log(`${p.av} ${p.name} 幸运卡，获得 ${ITEMS[it].name}。`,'good');refresh();break;}
    case 'teleport':chooseTeleport(p);break;
    case 'steal':chooseTargetPlayer(p,'steal','选择偷窃目标',o=>{const amt=Math.min(100,o.cash);o.cash-=amt;p.cash+=amt;log(`${p.av} 从 ${o.av} ${o.name} 偷取 ¥${amt}。`,'evt');refresh();});break;
    case 'protect':{let got=0;G.players.forEach(o=>{if(o.id!==p.id&&o.alive){const a=Math.min(50,o.cash);o.cash-=a;got+=a;}});p.cash+=got;log(`${p.av} ${p.name} 收保护费，共 ¥${got}。`,'good');refresh();break;}
    case 'freeze':chooseTargetPlayer(p,'freeze','选择冻结目标',o=>{o.skipNext=true;log(`${o.av} ${o.name} 被冻结，下回合跳过。`,'evt');refresh();});break;
    case 'troll':chooseTargetPlayer(p,'troll','选择损友目标',o=>{pay(o,100,null,'损友卡');log(`${o.av} ${o.name} 被损友，付¥100给银行。`,'bad');refresh();});break;
    case 'swap':chooseSwap(p);break;
  }
}
function chooseTargetPlayer(p,kind,title,cb){
  const opts=alivePlayers().filter(o=>o.id!==p.id);
  if(!opts.length){log('没有可选目标。');return;}
  let sel=opts[0].id;
  const list=el('div','list');
  opts.forEach(o=>{const d=el('div','opt'+(sel===o.id?' sel':''));d.innerHTML=`<div class="swatch" style="background:${o.color}"></div>${o.av} ${o.name}（¥${o.cash}）`;d.onclick=()=>{sel=o.id;list.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};list.appendChild(d);});
  openModalEl(`
    <h2>${ITEMS[kind].name}</h2>
    <div class="row">${title}</div>
    <div class="actions"><button class="btn primary" id="confirmT">确认</button><button class="btn" onclick="closeModal()">取消</button></div>`,
    [list,'confirmT'],()=>{closeModal();cb(G.players[sel]);});
}
function openModalEl(html,extra,onConfirm){
  $('mContent').innerHTML=html;
  // 把extra[0]插入到actions前
  if(extra[0]){$('mContent').insertBefore(extra[0],$('mContent').querySelector('.actions'));}
  $('mModal').classList.add('show');
  const b=$('mContent').querySelector('#'+extra[1]);
  if(b)b.onclick=onConfirm;
}
function chooseSwap(p){
  const myProps=p.props.filter(i=>isProp(i));
  if(!myProps.length){log('你没有可交换的地产。');return;}
  const targets=alivePlayers().filter(o=>o.id!==p.id&&o.props.some(i=>isProp(i)));
  if(!targets.length){log('没有可交换的玩家。');return;}
  let mySel=myProps[0],tSel=targets[0].id;
  let tPropSel=G.players[tSel].props.filter(i=>isProp(i))[0];
  const mkRow=(label,list)=>{const w=el('div');w.innerHTML=`<div class="row" style="color:var(--dim);font-size:12px">${label}</div>`;w.appendChild(list);return w;};
  const myL=el('div','list'),pL=el('div','list'),tL=el('div','list');
  const swatch=i=>`<div class="swatch" style="background:${COLORS[SPACES[i].g]||'#888'}"></div>`;
  function buildMy(){myL.innerHTML='';myProps.forEach(i=>{const d=el('div','opt'+(mySel===i?' sel':''));d.innerHTML=swatch(i)+SPACES[i].name;d.onclick=()=>{mySel=i;myL.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};myL.appendChild(d);});}
  function buildPlayers(){pL.innerHTML='';targets.forEach(o=>{const d=el('div','opt'+(tSel===o.id?' sel':''));d.innerHTML=`<div class="swatch" style="background:${o.color}"></div>${o.av} ${o.name}`;d.onclick=()=>{tSel=o.id;tPropSel=G.players[tSel].props.filter(i=>isProp(i))[0];buildTheir();pL.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};pL.appendChild(d);});}
  function buildTheir(){tL.innerHTML='';G.players[tSel].props.filter(i=>isProp(i)).forEach(i=>{const d=el('div','opt'+(tPropSel===i?' sel':''));d.innerHTML=swatch(i)+SPACES[i].name;d.onclick=()=>{tPropSel=i;tL.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};tL.appendChild(d);});}
  buildMy();buildPlayers();buildTheir();
  const mc=$('mContent');
  mc.innerHTML=`<h2>🔄 换房卡</h2><div class="actions"><button class="btn primary" id="okS">交换</button><button class="btn" onclick="closeModal()">取消</button></div>`;
  const acts=mc.querySelector('.actions');
  mc.insertBefore(mkRow('你的地产',myL),acts);
  mc.insertBefore(mkRow('交换对象',pL),acts);
  mc.insertBefore(mkRow('对方地产',tL),acts);
  $('mModal').classList.add('show');
  $('okS').onclick=()=>{
    const t=G.players[tSel];
    p.props=p.props.filter(x=>x!==mySel);p.props.push(tPropSel);
    t.props=t.props.filter(x=>x!==tPropSel);t.props.push(mySel);
    G.owners[mySel]=t.id;G.owners[tPropSel]=p.id;
    log(`${p.av} ${p.name} 用 ${SPACES[mySel].name} 换了 ${t.av} ${t.name} 的 ${SPACES[tPropSel].name}。`,'evt');
    closeModal();refresh();
  };
}
function chooseTeleport(p){
  // 选择目标格子：地产/车站/公用
  const targets=SPACES.map((s,i)=>({i,s})).filter(({s})=>s.t==='prop'||s.t==='rr'||s.t==='util'||s.t==='go');
  let sel=targets[0].i;
  const list=el('div','list');
  targets.forEach(({i,s})=>{const d=el('div','opt'+(sel===i?' sel':''));d.innerHTML=`<div class="swatch" style="background:${COLORS[s.g]||'#888'}"></div>${s.name}${s.price?' ¥'+s.price:''}`;d.onclick=()=>{sel=i;list.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};list.appendChild(d);});
  $('mContent').innerHTML=`<h2>🚕 传送卡</h2><div class="row">选择传送目标：</div><div class="actions"><button class="btn primary" id="okT">传送</button><button class="btn" onclick="closeModal()">取消</button></div>`;
  const acts=$('mContent').querySelector('.actions');
  $('mContent').insertBefore(list,acts);
  $('mModal').classList.add('show');
  $('okT').onclick=()=>{
    closeModal();
    // 若向前跨越起点
    if(sel<p.pos){p.cash+=GO_BONUS;log(`${p.av} ${p.name} 传送经过起点，领¥${GO_BONUS}。`,'good');}
    p.pos=sel;G.phase='move';refresh();
    log(`${p.av} ${p.name} 传送到 ${SPACES[sel].name}。`,'evt');
    setTimeout(()=>landOnSpace(p,sel),250);
  };
}

/* =========================================================
   交易 / 建房 / 认输
========================================================= */
$('btnTrade').onclick=openTrade;
$('btnBuild').onclick=openBuild;
$('btnResign').onclick=()=>{
  if(!confirm(cur().name+' 确认认输？'))return;
  const p=cur();p.alive=false;
  p.props.forEach(i=>{G.owners[i]=null;G.houses[i]=0;});p.props=[];
  log(`${p.av} ${p.name} 认输出局。`,'bad');refresh();
  if(!checkWin())nextPlayer();
};

function openBuild(){
  const p=cur();
  const buildable=[];
  SPACES.forEach((s,i)=>{
    if(s.g&&G.owners[i]===p.id&&ownsFullGroup(p,s.g)&&G.houses[i]<5){buildable.push(i);}
  });
  if(!buildable.length){alert('无可建房产（需拥有完整同色组且未满5座）。');return;}
  let sel=buildable[0];
  const list=el('div','list');
  buildable.forEach(i=>{const s=SPACES[i];const cost=GROUPS[s.g].house;const d=el('div','opt'+(sel===i?' sel':''));d.innerHTML=`<div class="swatch" style="background:${COLORS[s.g]}"></div>${s.name}（${G.houses[i]>=5?'酒店':G.houses[i]+'座'}，建房¥${cost}）`;d.onclick=()=>{sel=i;list.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};list.appendChild(d);});
  $('mContent').innerHTML=`<h2>🔨 建房</h2><div class="row">选择地产建房（现金¥${p.cash}）：</div><div class="actions"><button class="btn primary" id="okB">建房</button><button class="btn" onclick="closeModal()">取消</button></div>`;
  const acts=$('mContent').querySelector('.actions');
  $('mContent').insertBefore(list,acts);
  $('mModal').classList.add('show');
  $('okB').onclick=()=>{
    const s=SPACES[sel];const cost=GROUPS[s.g].house;
    if(p.cash<cost){alert('现金不足');return;}
    p.cash-=cost;G.houses[sel]++;
    log(`${p.av} ${p.name} 在 ${s.name} 建${G.houses[sel]>=5?'酒店':'1座房'}（¥${cost}）。`,'good');
    closeModal();refresh();
  };
}

function openTrade(){
  const me=cur();const others=alivePlayers().filter(o=>o.id!==me.id);
  if(!others.length){alert('无可交易对象');return;}
  let tSel=others[0].id;
  let myGiveCash=0,tGiveCash=0;
  let myGiveProps=new Set(),tGiveProps=new Set();
  const tL=el('div','list');
  others.forEach(o=>{const d=el('div','opt'+(tSel===o.id?' sel':''));d.innerHTML=`<div class="swatch" style="background:${o.color}"></div>${o.av} ${o.name}`;d.onclick=()=>{tSel=o.id;tL.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');rebuildProps();};tL.appendChild(d);});
  function myProps(){return me.props.filter(i=>isProp(i));}
  function theirProps(){return G.players[tSel].props.filter(i=>isProp(i));}
  let myPL,tPL;
  function rebuildProps(){
    myPL.innerHTML='';myProps().forEach(i=>{const s=SPACES[i];const d=el('div','opt'+(myGiveProps.has(i)?' sel':''));d.innerHTML=`<div class="swatch" style="background:${COLORS[s.g]||'#888'}"></div>${s.name}`;d.onclick=()=>{if(myGiveProps.has(i))myGiveProps.delete(i);else myGiveProps.add(i);rebuildProps();};myPL.appendChild(d);});
    tPL.innerHTML='';theirProps().forEach(i=>{const s=SPACES[i];const d=el('div','opt'+(tGiveProps.has(i)?' sel':''));d.innerHTML=`<div class="swatch" style="background:${COLORS[s.g]||'#888'}"></div>${s.name}`;d.onclick=()=>{if(tGiveProps.has(i))tGiveProps.delete(i);else tGiveProps.add(i);rebuildProps();};tPL.appendChild(d);});
    $('tradeMyCash').textContent='¥'+myGiveCash;$('tradeTCash').textContent='¥'+tGiveCash;
    const t=G.players[tSel];
    $('tradeSummary').innerHTML=`你给出：¥${myGiveCash} + ${[...myGiveProps].map(i=>SPACES[i].name).join('、')||'无'}<br>对方给出：¥${tGiveCash} + ${[...tGiveProps].map(i=>SPACES[i].name).join('、')||'无'}`;
  }
  $('mContent').innerHTML=`
    <h2>🤝 玩家交易</h2>
    <div class="row" style="color:var(--dim);font-size:12px">交易对象</div>
    <div class="row" style="color:var(--dim);font-size:12px">你给出的地产</div>
    <div class="row" style="color:var(--dim);font-size:12px">你给出的现金 <button class="btn small" id="myCashUp">+50</button> <span id="tradeMyCash" style="color:var(--accent)">¥0</span></div>
    <div class="row" style="color:var(--dim);font-size:12px">对方给出的地产</div>
    <div class="row" style="color:var(--dim);font-size:12px">对方给出的现金 <button class="btn small" id="tCashUp">+50</button> <span id="tradeTCash" style="color:var(--accent)">¥0</span></div>
    <div class="row" id="tradeSummary" style="background:#0c1222;padding:8px;border-radius:8px"></div>
    <div class="actions"><button class="btn primary" id="okTrade">提议交易</button><button class="btn" onclick="closeModal()">取消</button></div>`;
  const acts=$('mContent').querySelector('.actions');
  myPL=el('div','list');tPL=el('div','list');
  // 插入元素
  const rows=$('mContent').querySelectorAll('.row');
  $('mContent').insertBefore(tL,rows[1]);
  $('mContent').insertBefore(myPL,rows[2]);
  $('mContent').insertBefore(tPL,rows[4]);
  $('mModal').classList.add('show');
  rebuildProps();
  $('myCashUp').onclick=()=>{myGiveCash=Math.min(myGiveCash+50,me.cash);rebuildProps();};
  $('tCashUp').onclick=()=>{tGiveCash=tGiveCash+50;rebuildProps();};
  $('okTrade').onclick=()=>{
    const t=G.players[tSel];
    if(myGiveCash>me.cash){alert('你的现金不足');return;}
    if(tGiveCash>t.cash){alert('对方现金不足');return;}
    if(!confirm(`确认与 ${t.name} 完成交易？\n`+$('tradeSummary').innerText))return;
    me.cash-=myGiveCash;t.cash+=myGiveCash;
    t.cash-=tGiveCash;me.cash+=tGiveCash;
    myGiveProps.forEach(i=>{me.props=me.props.filter(x=>x!==i);t.props.push(i);G.owners[i]=t.id;});
    tGiveProps.forEach(i=>{t.props=t.props.filter(x=>x!==i);me.props.push(i);G.owners[i]=me.id;});
    log(`${me.av} ${me.name} 与 ${t.av} ${t.name} 完成交易。`,'evt');
    closeModal();refresh();
  };
}

/* =========================================================
   模态通用
========================================================= */
function openModal(html){$('mContent').innerHTML=html;$('mModal').classList.add('show');}
function closeModal(){$('mModal').classList.remove('show');}
$('mModal').onclick=e=>{if(e.target.id==='mModal'){}};

/* =========================================================
   胜利
========================================================= */
function showWin(winner){
  openModal(`
    <div class="win-screen">
      <div class="crown">👑</div>
      <h2>大赢家</h2>
      <div class="row" style="font-size:18px;color:${winner.color}">${winner.av} ${winner.name}</div>
      <div class="row">资产 ¥${networth(winner)}</div>
      <div class="actions"><button class="btn primary" onclick="location.reload()">再来一局</button></div>
    </div>`);
}

/* =========================================================
   开始界面
========================================================= */
const usedColors=new Set();
function initStart(){
  const cp=$('colorPick');cp.innerHTML='';
  PLAYER_COLORS.forEach((c,i)=>{const d=el('div','cpick');d.style.background=c;d.dataset.c=c;d.dataset.i=i;d.onclick=()=>{document.querySelectorAll('.cpick').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};cp.appendChild(d);});
  document.querySelector('.cpick').classList.add('sel');
  updateStartList();
}
const joinedPlayers=[];
function updateStartList(){
  const l=$('startList');l.innerHTML='';
  joinedPlayers.forEach(p=>{const d=el('div','pl');d.innerHTML=`<div class="sw" style="background:${p.color}"></div>${p.av} ${p.name}`;l.appendChild(d);});
  $('btnStart').disabled=joinedPlayers.length<2;
}
$('btnJoin').onclick=()=>{
  const name=$('inName').value.trim()||('玩家'+(joinedPlayers.length+1));
  const cSel=document.querySelector('.cpick.sel');
  const color=cSel?cSel.dataset.c:PLAYER_COLORS[joinedPlayers.length];
  const i=PLAYER_COLORS.indexOf(color);
  if(joinedPlayers.some(p=>p.color===color)){alert('该颜色已被占用');return;}
  if(joinedPlayers.length>=4){alert('已满4人');return;}
  joinedPlayers.push({name,color,av:PLAYER_AV[i>=0?i:joinedPlayers.length]});
  // 自动切换下一个颜色
  const nextI=joinedPlayers.length<4?joinedPlayers.length:0;
  document.querySelectorAll('.cpick').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.cpick')[nextI]?.classList.add('sel');
  $('inName').value='玩家'+(joinedPlayers.length+1);
  updateStartList();
};
$('btnStart').onclick=()=>{
  $('startScreen').style.display='none';
  renderBoard();
  newGame(joinedPlayers);
};
initStart();
</script>
